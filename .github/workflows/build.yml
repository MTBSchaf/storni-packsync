name: Build Plugin
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Build
        run: mvn -B package
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build
          files: target/PackSync.jar
